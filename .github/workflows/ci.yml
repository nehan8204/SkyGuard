name: SkyGuard 
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Suite on CORRECT build (must pass)
        run: SUT=correct pytest -v --junitxml=report-correct.xml

      - name: Oracle check - BROKEN build (must fail)
        run: |
          if SUT=broken pytest -q; then
            echo "ORACLE FAILURE: broken build passed the suite"; exit 1
          else
            echo "OK: broken build was detected"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: report-correct.xml
